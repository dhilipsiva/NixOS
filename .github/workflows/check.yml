name: check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  flake:
    name: Evaluate and run the light checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            max-jobs = 1
            accept-flake-config = false
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      # Evaluates every host configuration (desktop, ThinkPad and Yoga).
      - run: nix flake check --no-build .
      # The checks that need no virtual machine and no master-branch builds;
      # VM tests, the Hyprland parser and `nixosctl check --stable` stay local.
      - run: >-
          nix build --no-link
          .#checks.x86_64-linux.formatting
          .#checks.x86_64-linux.repository-workflow
          .#checks.x86_64-linux.stable-releases
          .#checks.x86_64-linux.host-policies
          .#checks.x86_64-linux.yoga-policies
          .#checks.x86_64-linux.zellij-config
