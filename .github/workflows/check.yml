name: check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  flake:
    name: Evaluate and run the light checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            max-jobs = 1
            accept-flake-config = false
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Evaluates every output, both hosts and all check derivations.
      - run: nix flake check --no-build .
      # The checks that need no virtual machine and no master-branch builds;
      # VM tests, the Hyprland parser and `nixosctl check --stable` stay local.
      - run: >-
          nix build --no-link
          .#checks.x86_64-linux.formatting
          .#checks.x86_64-linux.repository-workflow
          .#checks.x86_64-linux.stable-releases
          .#checks.x86_64-linux.host-policies
          .#checks.x86_64-linux.zellij-config
